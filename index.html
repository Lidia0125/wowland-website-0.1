function createLocalAsset(data){return {id:'local-material-'+crypto.randomUUID(),name:data.name,storyId:data.storyId,kind:data.kind||'文字',tags:data.tags||[],usage:data.usage||'pending',factChecked:!!data.factChecked,text:data.text||'',sourceName:data.sourceName||'',note:data.note||'浏览器内演示资料，未上传或自动分析。',revision:1}}

 libraryImport.files.forEach((file,index)=>assets.push(createLocalAsset({...common,name:libraryImport.files.length>1?common.name+' · '+file.name:common.name,kind:file.kind||libraryFileKind(file.name,file.type),sourceName:file.name})));

function rankedLibraryStories(){
 const task=state.task.trim().toLowerCase();
 return libraryStories.filter(s=>!s.inbox).map(story=>{
  const assets=storyAssets(story.id).filter(m=>materialCanUse(m.id));
  const chosen=assets.filter(m=>state.materials.includes(m.id));
  const terms=[...new Set(assets.flatMap(m=>Array.isArray(m.tags)?m.tags:[]))].filter(t=>typeof t==='string'&&t.length>=2);
  const hits=task?terms.filter(t=>task.includes(t.toLowerCase())):[];
  const titleHit=task&&story.title.length>=2&&task.includes(story.title.toLowerCase());
  return {story,assets,chosen,hits,titleHit,rank:(chosen.length?10000:0)+hits.length*10+(titleHit?5:0)};
 }).filter(s=>s.assets.length).sort((a,b)=>b.rank-a.rank||a.story.title.localeCompare(b.story.title,'zh-CN'));
}

renderScriptEditor=function(d,draft){

 return `<section class="direction-story-summary"><strong>本方案主故事：${escapeHTML(d.storyTitle)}</strong><p>表达设计：${escapeHTML(d.pattern)}<br>本方向素材：${escapeHTML(d.chosenAssetIds.map(id=>materials.find(m=>m.id===id)?.name||'资料已变化').join('、'))}</p><p>参考板可保留其他故事，本方案按这个主故事展开。</p></section>`+html.replace(escapeHTML(state.creation.snapshot.materialNames.join('、')||'待补充'),escapeHTML(d.chosenAssetIds.map(id=>materials.find(m=>m.id===id)?.name||'资料已变化').join('、')));
};
const storyOriginalRenderCreation=renderCreation;
renderCreation=function(){storyOriginalRenderCreation();const placeholder=$('.creation-placeholder p');if(!state.creation.snapshot&&placeholder)placeholder.textContent='输入任务后，从机构素材库寻找不同故事，比较各自适合的表达设计。';const note=$('.creation-prototype-note');if(note&&note.closest('.creation-brief'))note.textContent='线框演示：从全库可用故事组织方向，已选优先。讲法配对使用名称、标签和资料类型规则，未调用AI。'};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.directionMaterial&&directionPick){const id=b.dataset.directionMaterial;if(!materialCanUse(id))return;directionPick.ids=directionPick.ids.includes(id)?directionPick.ids.filter(x=>x!==id):[...directionPick.ids,id];renderDirectionPick();return}
 if(b.hasAttribute('data-direction-confirm')&&directionPick){
  if(creationIsStale()){toast('依据已变化，请返回更新方向');return}
  const d=state.creation.snapshot.storyDirections.find(x=>x.id===directionPick.id),chosen=directionPick.ids.filter(id=>d.assetIds.includes(id)&&materialCanUse(id));if(!chosen.length)return;
  state.materials=[...new Set([...state.materials.filter(id=>!d.assetIds.includes(id)),...chosen])];
  state.creation.snapshot.materialNames=state.materials.map(id=>materials.find(m=>m.id===id).name);
  state.creation.snapshot.storyDirections.forEach(row=>row.chosenAssetIds=row.assetIds.filter(id=>state.materials.includes(id)));
  state.creation.snapshot.signature=basisSignature();state.creation.chosen=d.id;
  const key=currentDraftKey();if(!state.creation.drafts[key])state.creation.drafts[key]=makeDraft(d);
  persist();$('#dialog').close();renderBoard();renderCreation();toast('已按主故事和确认的素材展开方案示例');
 }
});
render();

'use strict';
// AI revision UX only. Presets are local text rules; custom requests are not sent.
let revisionSelection=null,revisionSession=null;
const revisionOriginalEditor=renderScriptEditor;
function revisionFieldLabel(path){const [a,b]=path.split('.');return a==='shots'?`镜头 ${Number(b)+1}`:({title:'方案标题',summary:'创作思路',opening:'开场设计',structure:'叙事顺序'}[a]||a)}
function revisionLabel(path){if(!path.startsWith('shots.'))return revisionFieldLabel(path);const parts=path.split('.');return revisionFieldLabel(path)+' · '+({visual:'画面',audio:'旁白与采访',time:'时长',notes:'执行要求'}[parts[2]]||parts[2])}
function revisionGet(d,path){return path.split('.').reduce((v,k)=>v?.[k],d)??''}
function revisionSet(d,path,value){const keys=path.split('.');let obj=d;for(const key of keys.slice(0,-1))obj=obj[key];obj[keys.at(-1)]=value}
renderScriptEditor=function(d,draft){
 let html=revisionOriginalEditor(d,draft);
 const toolbar=`<section class="revision-toolbar"><div><strong>优先局部改稿</strong><p>选中文字后修改，或从各镜头进入。候选经确认后才替换。</p></div><div class="revision-toolbar-actions"><button data-revision-selection disabled>修改选中文字</button><button data-revision-whole>整稿修改</button><button data-revision-undo ${draft.revisionHistory?.length?'':'disabled'}>撤销上次采用</button></div><p class="revision-prototype-note">AI改稿交互演示：预设仅执行本地文字规则；自定义要求可记录并手工调整候选，未接入模型。</p></section>`;
 html=html.replace('<section class="script-editor">','<section class="script-editor">'+toolbar);
 return html.replace(/<strong>镜头 (\d+)<\/strong>/g,(match,n)=>match+`<button class="small revision-shot" data-revision-shot="${Number(n)-1}" aria-label="局部修改镜头${n}">局部修改</button>`);
};
function revisionOpen(paths,fragment=null){
 const draft=currentDraft();if(!draft)return;if(creationIsStale()){toast('任务或素材已变化，请先更新创作方向');return}
 revisionSession={key:currentDraftKey(),paths,fragment,originals:Object.fromEntries(paths.map(p=>[p,String(revisionGet(draft,p))])),instruction:'',preset:'custom',stage:'request',candidates:{}};
 renderRevisionDialog();
}
function renderRevisionDialog(){
 const s=revisionSession;if(!s)return;const whole=s.paths.length>1,fragment=s.fragment;
 const scope=whole?'整份方案的表达与画面建议':fragment?'选中的文字':revisionLabel(s.paths[0]);
 if(s.stage==='request'){
 showDialog(`<div class="revision-dialog"><h2>${whole?'整稿修改':'局部修改'}</h2><p><strong>修改范围：${escapeHTML(scope)}</strong><br>主故事、素材来源和人物事实保持原有依据。</p>${!whole&&!fragment&&s.paths[0].startsWith('shots.')?`<label for="revision-target">本镜头要修改哪一项？</label><select id="revision-target">${['audio','visual','time','notes'].map(k=>{const path=s.paths[0].split('.').slice(0,2).join('.')+'.'+k;return `<option value="${path}" ${path===s.paths[0]?'selected':''}>${revisionLabel(path)}</option>`}).join('')}</select>`:''}<label for="revision-preset">演示方式</label><select id="revision-preset"><option value="custom" ${s.preset==='custom'?'selected':''}>自定义要求，手工编辑候选</option><option value="short" ${s.preset==='short'?'selected':''}>预设：精简文字</option><option value="rhythm" ${s.preset==='rhythm'?'selected':''}>预设：按句分行，调整阅读节奏</option></select><label for="revision-instruction">希望怎样修改？</label><textarea id="revision-instruction" maxlength="2000" placeholder="例如：这段旁白太长，保留关键信息，让表达更自然">${escapeHTML(s.instruction)}</textarea><details class="revision-original"><summary>查看当前内容</summary><pre>${escapeHTML(whole?s.paths.map(p=>revisionLabel(p)+'：'+s.originals[p]).join('\n\n'):fragment?fragment.text:s.originals[s.paths[0]])}</pre></details><p class="revision-prototype-note">自定义要求不会被AI执行；候选先保留原文，可在下一步手工修改。预设仅演示文字处理，不代表完成语义改写。</p><p id="revision-error" role="alert"></p><div class="dialog-actions"><button data-action="close-dialog">取消</button><button class="primary" data-revision-preview>预览修改候选</button></div></div>`);return;
 }
 showDialog(`<div class="revision-dialog"><h2>修改前后对照</h2><p>范围：${escapeHTML(scope)}<br>要求：${escapeHTML(s.instruction||'执行所选文字规则')}<br>候选可继续编辑，尚未替换原稿。</p>${s.paths.map((path,i)=>`<section class="revision-comparison"><h3>${escapeHTML(revisionLabel(path))}${fragment?' · 选中片段':''}</h3><details class="revision-original" ${whole?'':'open'}><summary>修改前</summary><pre>${escapeHTML(fragment?fragment.text:s.originals[path])}</pre></details><label for="revision-candidate-${i}">修改候选</label><textarea id="revision-candidate-${i}" data-revision-candidate="${i}">${escapeHTML(s.candidates[path])}</textarea></section>`).join('')}<p class="revision-prototype-note">请核对事实与原意。主故事、素材引用与未选择的内容不会被此次操作替换。</p><div class="dialog-actions"><button data-revision-back>调整要求</button><button data-action="close-dialog">放弃修改</button><button class="primary" data-revision-apply>采用修改</button></div></div>`);
}
function revisionRule(text,preset){
 if(preset==='rhythm')return text.replace(/([。！？；])\s*/g,'$1\n').trim();
 if(preset==='short')return text.replace(/当前仅使用已确认选择的资料，/g,'').replace(/具体经历、人物原话和传播目标仍需核实。/g,'经历、原话与目标待核实。').replace(/所需的真实画面/g,'的真实画面').replace(/依据机构资料整理旁白/g,'据机构资料整理旁白').replace(/具体事实以机构核实资料为准/g,'事实以核实资料为准').replace(/[ \t]{2,}/g,' ').trim();
 return text;
}
document.addEventListener('select',e=>{
 const field=e.target;if(!field.matches?.('.script-editor textarea'))return;
 const path=field.dataset.draftField||(field.dataset.shot!==undefined&&['visual','audio','notes'].includes(field.dataset.shotField)?`shots.${field.dataset.shot}.${field.dataset.shotField}`:null);
 const start=field.selectionStart,end=field.selectionEnd;
 revisionSelection=path&&end>start?{key:currentDraftKey(),path,start,end,text:field.value.slice(start,end)}:null;
 const button=$('[data-revision-selection]');if(button)button.disabled=!revisionSelection;
});
document.addEventListener('change',e=>{if(e.target.id==='revision-target'&&revisionSession){const path=e.target.value;revisionSession.paths=[path];revisionSession.originals={[path]:String(revisionGet(currentDraft(),path))};const label=$('.revision-dialog>p strong');if(label)label.textContent='修改范围：'+revisionLabel(path);const before=$('.revision-original pre');if(before)before.textContent=revisionSession.originals[path]}});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-revision-shot')){revisionOpen([`shots.${b.dataset.revisionShot}.audio`]);return}
 if(b.hasAttribute('data-revision-selection')){const range=revisionSelection;if(!range||range.key!==currentDraftKey()||String(revisionGet(currentDraft(),range.path)).slice(range.start,range.end)!==range.text){toast('请重新选中需要修改的文字');return}revisionOpen([range.path],range);return}
 if(b.hasAttribute('data-revision-whole')){const d=currentDraft();if(d)revisionOpen(['title','summary','opening','structure',...d.shots.flatMap((_,i)=>[`shots.${i}.visual`,`shots.${i}.audio`])]);return}
 if(b.hasAttribute('data-revision-preview')&&revisionSession){const s=revisionSession;s.instruction=$('#revision-instruction').value.trim();s.preset=$('#revision-preset').value;if(s.preset==='custom'&&!s.instruction){$('#revision-error').textContent='请写下修改要求，或选择一种预设演示。';return}s.candidates=Object.fromEntries(s.paths.map(p=>[p,revisionRule(s.fragment?s.fragment.text:s.originals[p],s.preset)]));s.stage='compare';renderRevisionDialog();return}
 if(b.hasAttribute('data-revision-back')&&revisionSession){revisionSession.paths.forEach((p,i)=>revisionSession.candidates[p]=$(`#revision-candidate-${i}`).value);revisionSession.stage='request';renderRevisionDialog();return}
 if(b.hasAttribute('data-revision-apply')&&revisionSession){const s=revisionSession,d=currentDraft();if(!d||s.key!==currentDraftKey()||creationIsStale()||s.paths.some(p=>String(revisionGet(d,p))!==s.originals[p])){toast('原稿或依据已变化，请关闭候选后重新修改');return}const changes=s.paths.map((path,i)=>{const candidate=$(`#revision-candidate-${i}`).value,after=s.fragment?s.originals[path].slice(0,s.fragment.start)+candidate+s.originals[path].slice(s.fragment.end):candidate;return {path,before:s.originals[path],after}}).filter(c=>c.before!==c.after);if(!changes.length){toast('候选与原稿相同，可以先编辑候选');return}changes.forEach(c=>revisionSet(d,c.path,c.after));d.revisionHistory=[...(d.revisionHistory||[]),{time:new Date().toISOString(),instruction:s.instruction,changes}].slice(-10);persist();$('#dialog').close();revisionSession=null;revisionSelection=null;renderCreation();toast('已采用修改，可撤销最近一次采用');return}
 if(b.hasAttribute('data-revision-undo')){const d=currentDraft(),last=d?.revisionHistory?.at(-1);if(!last)return;if(last.changes.some(c=>String(revisionGet(d,c.path))!==c.after)){toast('这些内容已有后续编辑，未覆盖当前版本');return}last.changes.forEach(c=>revisionSet(d,c.path,c.before));d.revisionHistory.pop();persist();renderCreation();toast('已撤销最近一次采用');}
});
render();

'use strict';
let draftExportURL=null;
function draftExportMarkdown(){
 const d=currentDraft(),direction=currentDirection();if(!d)return '';
 const lines=['# '+d.title,'','交互示例草稿，未调用AI，不可直接作为真实发布内容。','','## 本次任务',state.creation.snapshot.task,'','## 主故事',direction?.storyTitle||'旧版结构示例，主故事待确认','','## 表达设计',d.patterns,'','## 创作思路',d.summary,'','## 开场',d.opening,'','## 叙事顺序',d.structure,'','## 外部参考',d.reference];
 d.shots.forEach((shot,i)=>lines.push('','## 镜头 '+(i+1)+' '+shot.time,'画面：'+shot.visual,'声音：'+shot.audio,'素材：'+shot.source,'执行：'+shot.notes));
 return lines.join('\n');
}
exportDraft=function(){
 if(creationIsStale()){toast('请先依据最新任务和素材重新查看方向');return}
 const text=draftExportMarkdown();if(!text)return;
 if(draftExportURL)URL.revokeObjectURL(draftExportURL);
 draftExportURL=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));
 const filename=(currentDraft().title||'renai-script-draft').replace(/[<>:"/\\|?*\u0000-\u001f]/g,'-').slice(0,80)+'.md';
 showDialog(`<h2>导出草稿</h2><p>下方为当前版本的实际输出，包含任务、主故事、表达设计、参考及全部分镜。请核对后下载或复制。</p><label for="draft-export-preview">导出内容（Markdown）</label><textarea id="draft-export-preview" class="draft-export-preview" readonly></textarea><p class="export-download-note">浏览器未开始下载时，可使用“复制全文”取用内容。复制失败时，也可在文本框内全选复制。</p><div id="draft-export-status" role="status" class="draft-export-status">尚未发起下载</div><div class="dialog-actions export-actions"><button data-action="close-dialog">返回编辑</button><button data-export-copy>复制全文</button><a class="export-download-link" id="draft-export-download" download="${escapeHTML(filename)}">下载 Markdown</a></div>`);
 $('#draft-export-preview').value=text;$('#draft-export-download').href=draftExportURL;
};
document.addEventListener('click',async e=>{
 const download=e.target.closest('#draft-export-download');if(download){$('#draft-export-status').textContent='已请求浏览器下载。请在下载记录中确认；也可直接复制全文。';return}
 if(e.target.closest('[data-export-copy]')){const field=$('#draft-export-preview'),status=$('#draft-export-status');status.textContent='正在复制…';try{await Promise.race([navigator.clipboard.writeText(field.value),new Promise((_,reject)=>setTimeout(()=>reject(new Error('clipboard timeout')),1500))]);status.textContent='已复制全文，可粘贴到文档。'}catch{field.focus();field.select();status.textContent='自动复制未完成，已选中全文，请按 Ctrl+C 手动复制。'}}
});
